data:
  _target_: datasets.infra.IRDataset
  root: exp/datasets/masonry_bridges
  patch_size: ${general.patch_size}
  infra_name: begc
  norm_method: unstd
  image_size: ${data_setting.image_size}
  abs_normalize: true
  require_labels: true
model:
  ddpm:
    type: openai
    in_channels: 3
    out_channels: 3
    num_channels: 256
    num_heads: 4
    num_res_blocks: 2
    attention_resolutions: 32,16,8
    dropout: 0.0
    resamp_with_conv: true
    learn_sigma: true
    use_scale_shift_norm: true
    use_fp16: true
    resblock_updown: true
    num_heads_upsample: -1
    var_type: fixedsmall
    num_head_channels: 64
    image_size: 256
    class_cond: false
    use_new_attention_order: false
    use_boundary_constraint: false
  data:
    dataset: cifar10
    exp: ${general.exp}
  classifier:
    image_size: ${general.image_size}
    classifier_attention_resolutions: 32,16,8
    classifier_depth: 2
    classifier_pool: attention
    classifier_resblock_updown: true
    classifier_width: 128
    classifier_use_scale_shift_norm: true
    classifier_scale: 1.0
    classifier_use_fp16: true
scheduler:
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
  num_diffusion_timesteps: 1000
  time_travel:
    T_sampling: 100
    travel_length: 1
    travel_repeat: 1
general:
  seed: 1234
  exp: exp
  patch_size:
  - 0.8
  - 0.8
  - 0.5
  simplified: true
  image_folder: images
  verbose: info
  ni: false
  subset_start: -1
  subset_end: -1
  noise_type: gaussian
  add_noise: false
  rescaled: true
  uniform_dequantization: false
  gaussian_dequantization: false
  random_flip: true
  logit_transform: false
  save_results: true
  recompute: false
data_setting:
  num_workers: 32
  batch_size: 2
  channels: 3
  image_size: 256
image_restore:
  deg: inpainting
  sigma_y: 0.0
  eta: 0.85
  deg_scale: 4.0
