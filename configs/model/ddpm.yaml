# configs/model/ddpm.yaml
ddpm:
    type: "openai" # 'simple' or 'openai'
    in_channels: 3
    out_channels: 3
    num_channels: 256
    num_heads: 4
    num_res_blocks: 2
    attention_resolutions: "32,16,8"
    dropout: 0.0
    resamp_with_conv: True
    learn_sigma: True
    use_scale_shift_norm: true
    use_fp16: true
    resblock_updown: true
    num_heads_upsample: -1
    var_type: 'fixedsmall'
    num_head_channels: 64
    image_size: 256
    class_cond: False
    use_new_attention_order: false
    use_boundary_constraint: true    # default to be true


data:
    dataset: "cifar10"   # use it only in 'simple' model type
    exp: ${general.exp}

classifier:
    image_size: ${general.image_size}
    classifier_attention_resolutions: "32,16,8"
    classifier_depth: 2
    classifier_pool: "attention"
    classifier_resblock_updown: True
    classifier_width: 128
    classifier_use_scale_shift_norm: True
    classifier_scale: 1.0
    classifier_use_fp16: True
